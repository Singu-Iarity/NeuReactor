<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuReactor Control Room</title>
  <link rel="stylesheet" href="/css/room.css">
  <script>window.NR_TOKEN = "__OPERATOR_TOKEN__";</script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">NeuReactor <span id="conn" class="conn"></span></div>
    <div id="unit" class="unit"></div>
    <div id="career-top" class="career-top"></div>
    <div class="powerbar">
      <span>GROSS<b id="pb-gross">—</b></span>
      <span>NET<b id="pb-net">—</b></span>
      <span id="pb-demand-box" class="demand" title="Grid demand (click for the grid station)">DEMAND<b id="pb-demand">—</b></span>
    </div>
    <div class="clock"><span class="clock-label">SIM TIME</span><span id="simtime" class="seg-val">0:00:00</span></div>
    <div class="timectl" id="timectl">
      <button data-scale="pause" title="Pause">❚❚</button>
      <button data-scale="1">1×</button>
      <button data-scale="5">5×</button>
      <button data-scale="20">20×</button>
      <button data-scale="60">60×</button>
      <button data-scale="300">300×</button>
      <button data-scale="1000">1000×</button>
      <button data-scale="5000">5000×</button>
    </div>
    <div class="warpctl" title="Auto time warp: runs fast while the unit is steady on its grid target, and drops back as soon as the grid asks for a change or anything needs you">
      <button id="warp">AUTO WARP</button>
      <select id="warp-factor">
        <option value="100">100×</option><option value="300">300×</option><option value="1000" selected>1000×</option><option value="5000">5000×</option>
      </select>
      <span id="warp-state" class="warp-state"></span>
    </div>
    <div class="master">
      <button class="pb-round red" id="master-ack" title="Master acknowledge">ACK</button>
      <button class="pb-round red" id="master-sil" title="Silence horn">SIL</button>
      <button class="pb-round white" id="master-rst" title="Reset cleared alarms">RST</button>
      <button class="pb-round white" id="horn" title="Alarm horn on/off">♪</button>
    </div>
    <div class="soundctl" title="Master volume (click the speaker to mute)">
      <button id="mute" class="btn">🔊</button>
      <input id="volume" type="range" min="0" max="100" step="1">
    </div>
    <div id="top-scram"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="room"></main>
  <div id="toast" class="toast"></div>
  <div id="mcr-lights" class="lights-normal" aria-hidden="true"></div>
</body>
</html>
